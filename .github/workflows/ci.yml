name: Nexvion CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  validate-build-test:
    name: Validate, Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "products.html"
            "payment.html"
            "script.js"
            "payment.js"
            "style.css"
            "products.css"
            "payment.css"
            "logo.png"
            "Dockerfile"
            "nginx/default.conf"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine \
            nginx -t

      - name: Build Nexvion container image
        run: |
          docker build \
            --tag nexvion:${{ github.sha }} \
            --tag nexvion:ci \
            .

      - name: Start Nexvion container
        run: |
          docker run -d \
            --name nexvion-ci \
            -p 8080:8080 \
            nexvion:${{ github.sha }}

      - name: Verify container is running
        run: |
          if [[ "$(docker inspect -f '{{.State.Running}}' nexvion-ci)" != "true" ]]; then
            echo "ERROR: Nexvion container is not running."
            docker logs nexvion-ci
            exit 1
          fi

      - name: Diagnose container networking
        run: |
          echo "=== CONTAINER ==="
          docker ps -a

          echo "=== PORT MAPPING ==="
          docker port nexvion-ci

          echo "=== CONTAINER IP ==="
          docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' nexvion-ci

          echo "=== NGINX LISTENERS ==="
          docker exec nexvion-ci \
            sh -c 'nginx -T 2>&1 | grep -n "listen"'

          echo "=== HEALTH CHECK FROM INSIDE CONTAINER ==="
          docker exec nexvion-ci \
            wget -qO- http://127.0.0.1:8080/healthz

          echo
          echo "=== HEALTH CHECK THROUGH PUBLISHED PORT ==="
          curl -v http://127.0.0.1:8080/healthz

      - name: Test health endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 \
            http://127.0.0.1:8080/healthz

      - name: Test homepage
        run: |
          curl --fail --retry 5 --retry-delay 2 \
            http://127.0.0.1:8080/ \
            > /tmp/index.html

          grep -qi '<title>NEXVION' /tmp/index.html

      - name: Test static assets
        run: |
          for asset in \
            "/style.css" \
            "/products.css" \
            "/payment.css" \
            "/script.js" \
            "/payment.js" \
            "/logo.png"
          do
            echo "Testing $asset"

            curl --fail --retry 5 --retry-delay 2 \
              --silent --show-error \
              "http://127.0.0.1:8080$asset" \
              -o /dev/null
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexvion"

          echo "Publishing image:"
          echo "${IMAGE_NAME}:${GITHUB_SHA}"

          docker tag \
            "nexvion:${GITHUB_SHA}" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Push image to GHCR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexvion"

          docker push \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs nexvion-ci || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexvion"

          docker rm -f nexvion-ci 2>/dev/null || true

          docker image rm \
            "nexvion:${GITHUB_SHA}" \
            "nexvion:ci" \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            2>/dev/null || true
